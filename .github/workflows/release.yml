# Publishes a GitHub release for every version tag pushed, such as v0.2.0:
# it runs the checks, builds canopy for Linux, macOS and Windows, and uses
# the tag's message as the release notes (its first line as the title).
#
# Releasing is then: write the notes in a signed tag and push it.
#
#   git tag -s v0.2.0      # the notes, as for v0.1.0
#   git push origin v0.2.0
#
# For a tag pushed before this workflow existed, run it by hand: Actions,
# Release, Run workflow, with the tag's name.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to release, such as v0.1.0
        required: true

permissions:
  contents: write # to create the release

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04 # pinned, so a new image never changes a release by surprise
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # The checkout leaves out the tag's own message; fetch the tag itself.
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The runner's own shellcheck is older and flags what 0.11 doesn't;
      # use the version the checks are run with locally.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSLo "$RUNNER_TEMP/sc.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Check
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          shellcheck install.sh update.sh
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            name=canopy-$TAG-$os-$arch
            exe=canopy
            [ "$os" = windows ] && exe=canopy.exe
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "$name/$exe" .
            cp LICENSE README.md "$name/"
            if [ "$os" = windows ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(git cat-file -t "$TAG")" = tag ] || { echo "$TAG is not an annotated tag: its message is the release notes"; exit 1; }
          git tag -l --format='%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"
          title=$(git tag -l --format='%(contents:subject)' "$TAG")
          gh release create "$TAG" dist/* --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
